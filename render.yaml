services:
  # ── Backend API (FastAPI + C++ Engine) ──
  - type: web
    name: streamcsv-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 8000

  # ── Frontend (Static React/Vite) ──
  - type: web
    name: streamcsv-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    plan: free
    routes:
      - type: rewrite
        source: /api/*
        destination: https://streamcsv-api.onrender.com/api/*
